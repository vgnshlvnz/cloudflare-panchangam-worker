name = "panchangam"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Optional: serve on your own domain instead of *.workers.dev
# routes = [{ pattern = "panchangam.example.com", custom_domain = true }]

# Gives the Worker its deployment id, used to separate cache entries per deploy.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Per-visitor rate limit (free on all plans). 60 page loads a minute per IP is far
# beyond normal use but stops scripted loops from using up the daily request quota.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
